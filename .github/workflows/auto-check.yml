name: VortiJatra Auto Robot + FCM

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install requests beautifulsoup4 firebase-admin

      - name: Run Auto Robot + FCM
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: python scraper.py

      - name: Save notices.json
        run: |
          git config user.name "VortiJatra-Bot"
          git config user.email "bot@vortijatra.com"
          git add notices.json
          git diff --cached --quiet || git commit -m "Auto: new notice found"
          git push
